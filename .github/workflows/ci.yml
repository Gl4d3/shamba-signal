name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest --cov=shamba_signal --cov-report=term-missing
      - name: Validate repository contract
        run: uv run python scripts/validate_repo.py
      - name: Compile
        run: uv run python -m compileall -q src scripts
