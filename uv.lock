version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "annotated-types"
version = "0.7.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "anyio"
version = "4.8.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "idna" },
  { name = "sniffio" },
  { name = "typing-extensions", marker = "python_full_version < '3.13'" },
]

[[package]]
name = "certifi"
version = "2025.1.31"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "click"
version = "8.1.8"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "colorama", marker = "sys_platform == 'win32'" },
]

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "coverage"
version = "7.6.12"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "fastapi"
version = "0.115.8"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "pydantic" },
  { name = "starlette" },
  { name = "typing-extensions" },
]

[[package]]
name = "h11"
version = "0.14.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "httpcore"
version = "1.0.7"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "certifi" },
  { name = "h11" },
]

[[package]]
name = "httpx"
version = "0.28.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "anyio" },
  { name = "certifi" },
  { name = "httpcore" },
  { name = "idna" },
]

[[package]]
name = "idna"
version = "3.10"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "iniconfig"
version = "2.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "packaging"
version = "24.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pluggy"
version = "1.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.10.6"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "annotated-types" },
  { name = "pydantic-core" },
  { name = "typing-extensions" },
]

[[package]]
name = "pydantic-core"
version = "2.27.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "typing-extensions" },
]

[[package]]
name = "pygments"
version = "2.19.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.3.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "colorama", marker = "sys_platform == 'win32'" },
  { name = "iniconfig" },
  { name = "packaging" },
  { name = "pluggy" },
]

[[package]]
name = "pytest-cov"
version = "6.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "coverage" },
  { name = "pytest" },
]

[[package]]
name = "ruff"
version = "0.9.9"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "shamba-signal"
version = "0.1.0"
source = { editable = "." }
dependencies = [
  { name = "fastapi" },
  { name = "pydantic" },
  { name = "uvicorn" },
]

[package.optional-dependencies]
dev = [
  { name = "httpx" },
  { name = "pytest" },
  { name = "pytest-cov" },
  { name = "ruff" },
]

[package.metadata]
requires-dist = [
  { name = "fastapi", specifier = "==0.115.8" },
  { name = "pydantic", specifier = "==2.10.6" },
  { name = "uvicorn", specifier = "==0.34.0" },
]

[package.metadata.requires-extra]
dev = [
  { name = "httpx", specifier = "==0.28.1" },
  { name = "pytest", specifier = "==8.3.4" },
  { name = "pytest-cov", specifier = "==6.0.0" },
  { name = "ruff", specifier = "==0.9.9" },
]

[[package]]
name = "sniffio"
version = "1.3.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "starlette"
version = "0.45.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "anyio" },
]

[[package]]
name = "typing-extensions"
version = "4.12.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uvicorn"
version = "0.34.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
  { name = "click" },
  { name = "h11" },
]
